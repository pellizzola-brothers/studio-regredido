<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: blob:; worker-src blob: app:; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; font-src 'self' app: data:; connect-src 'self' app: blob:">
<title>Pellizzola Brothers Studio</title>
<link rel="stylesheet" href="style.css">

<header id="title">
	<div id="name" class="drag"></div>
	<div class="acts" role="toolbar" aria-label="File" aria-orientation="horizontal">
		<button data-act="new">new</button>
		<button data-act="open">open</button>
		<button data-act="save">save</button>
		<button data-act="saveas">save as</button>
	</div>
</header>

<div id="tabs">
	<div id="tablist"></div>
	<button id="add" title="New Lua script">+</button>
	<div class="drag grow"></div>
	<button id="run" class="run" disabled aria-disabled="true"
		title="Playtest is inert: the game cannot load .lvl archives yet (game/todo.txt 3.1)">&#9654;</button>
</div>

<div id="body">
	<aside id="side">
		<h2 class="hdr" id="hdr-scripts">scripts</h2>
		<ul id="scripts"></ul>
		<div id="splitter-scripts" class="splitter h" role="separator" tabindex="0"
			aria-orientation="horizontal" aria-label="Resize scripts list"></div>
		<h2 class="hdr" id="hdr-midi">midi<button id="addmidi" title="Import MIDI">+</button></h2>
		<ul id="midis"></ul>
	</aside>

	<div id="splitter-side" class="splitter v" role="separator" tabindex="0"
		aria-orientation="vertical" aria-label="Resize file manager"></div>

	<main id="stage">
		<div id="wrap"><canvas id="cv" tabindex="0" role="application"
			aria-label="Level canvas" aria-describedby="cv-help"></canvas></div>
		<p id="cv-help" class="sr-only">Arrow keys move the keyboard cursor.
			Enter or Space places the selected tool at the cursor. Delete
			removes what is under it. Escape clears the current selection.</p>
		<div id="hbar"><div id="hspace"></div></div>
		<div id="code"></div>
	</main>

	<div id="splitter-right" class="splitter v" role="separator" tabindex="0"
		aria-orientation="vertical" aria-label="Resize inspector"></div>

	<aside id="right">
		<h2 class="hdr r" id="hdr-items">items</h2>
		<div id="palette"></div>
		<div id="splitter-props" class="splitter h" role="separator" tabindex="0"
			aria-orientation="horizontal" aria-label="Resize palette"></div>
		<h2 class="hdr r" id="hdr-props">properties</h2>
		<div id="props" role="region" aria-label="Properties"></div>
	</aside>
</div>

<div id="status"><span id="cursor"></span><button id="zoom" title="Zoom"></button><span id="dims"></span><span id="entcount"></span><span id="tool"></span><span id="warnings"></span><span id="msg" role="status" aria-atomic="true"></span></div>

<script src="node_modules/monaco-editor/min/vs/loader.js"></script>
<script src="catalog.js"></script>
<script src="tokens.js"></script>
<script src="undo.js"></script>
<script src="grid.js"></script>
<script src="panel.js"></script>
<script src="layout.js"></script>
<script src="code.js"></script>
<script src="app.js"></script>
